name: Verify userscript
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  # Share the install location with both the root runner and catalog API tests.
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.runtime/playwright
jobs:
  component-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            catalog/package-lock.json
      - run: npm ci
      - run: npm --prefix catalog ci
      - run: npx playwright install --with-deps chromium
      - run: npm --prefix catalog run build
      - run: npm test && npm run typecheck
      - name: Catalog fixture and browser tests
        run: npm --prefix catalog test
      - name: Catalog typecheck
        run: npm --prefix catalog run typecheck
      - run: npm run test:browser
      - name: Release metadata and versioning tests
        run: npm run test:release
      - name: Check committed build reproducibility
        run: git diff --exit-code -- dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
